<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Red Ribbon Media — multimedia player banner</title>
  <desc id="desc">A minimalist red hourglass ribbon on black, with audio, video, and optical-disc formats in tapered condensed lettering.</desc>
  <defs>
    <style>
      .red { fill: #D6001C; }
      .white { fill: #F4F5F6; }
      .muted { fill: #BFC3C8; }
      .label { font-family: "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", sans-serif; font-weight: 800; letter-spacing: 1.2px; }
      .tiny { font-family: "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", sans-serif; font-weight: 700; letter-spacing: 1px; }
    </style>
    <clipPath id="ribbon-inner">
      <path d="M44 43 L410 91 L526 112 L580 120 L526 128 L410 149 L44 197 Z
               M1156 43 L790 91 L674 112 L620 120 L674 128 L790 149 L1156 197 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="240" fill="#111111"/>

  <!-- One continuous bow-tie silhouette -->
  <path class="red" d="M18 18 L600 105 L1182 18 L1182 222 L600 135 L18 222 Z"/>
  <path fill="#111111" d="M36 39 L600 108 L1164 39 L1164 201 L600 132 L36 201 Z"/>

  <!-- Fine inner rails echo the taper without adding visual clutter -->
  <path d="M48 51 L475 95 L550 108" fill="none" stroke="#F4F5F6" stroke-width="1.5" opacity=".9"/>
  <path d="M48 189 L475 145 L550 132" fill="none" stroke="#F4F5F6" stroke-width="1.5" opacity=".9"/>
  <path d="M1152 51 L725 95 L650 108" fill="none" stroke="#F4F5F6" stroke-width="1.5" opacity=".9"/>
  <path d="M1152 189 L725 145 L650 132" fill="none" stroke="#F4F5F6" stroke-width="1.5" opacity=".9"/>

  <!-- Audio: letterforms step down toward the narrow waist -->
  <g class="label white" text-anchor="middle">
    <text x="91" y="129" font-size="31">A</text>
    <text x="119" y="128" font-size="29">U</text>
    <text x="145" y="127" font-size="27">D</text>
    <text x="169" y="126" font-size="25">I</text>
    <text x="188" y="125" font-size="23">O</text>
  </g>
  <circle cx="218" cy="123" r="3.2" class="red"/>
  <g class="tiny white" text-anchor="middle">
    <text x="267" y="127" font-size="19">MUSIC</text>
  </g>
  <circle cx="309" cy="123" r="2.8" class="red"/>
  <g class="tiny white" text-anchor="middle">
    <text x="349" y="126" font-size="15">RADIO</text>
  </g>

  <!-- Central media/play mark -->
  <circle cx="600" cy="120" r="25" fill="#111111" stroke="#F4F5F6" stroke-width="2.4"/>
  <path class="red" d="M592 106 L612 120 L592 134 Z"/>
  <path d="M582 91 L592 96 M608 144 L618 149" stroke="#D6001C" stroke-width="2" stroke-linecap="square"/>

  <!-- Video / IPTV: tapered labels grow toward the outer edge -->
  <g class="tiny white" text-anchor="middle">
    <text x="851" y="125" font-size="15">IPTV</text>
  </g>
  <circle cx="891" cy="123" r="2.8" class="red"/>
  <g class="tiny white" text-anchor="middle">
    <text x="940" y="127" font-size="19">MOVIES</text>
  </g>
  <circle cx="993" cy="123" r="3.2" class="red"/>
  <g class="label white" text-anchor="middle">
    <text x="1032" y="125" font-size="23">V</text>
    <text x="1054" y="126" font-size="25">I</text>
    <text x="1073" y="127" font-size="27">D</text>
    <text x="1098" y="128" font-size="29">E</text>
    <text x="1125" y="129" font-size="31">O</text>
  </g>

  <!-- Compact optical-media line along the lower centre -->
  <g transform="translate(600 174)">
    <circle r="8.5" fill="none" stroke="#F4F5F6" stroke-width="1.7"/>
    <circle r="2.2" fill="#D6001C"/>
    <path d="M2 -7 L6 -4 L4 1" fill="none" stroke="#BFC3C8" stroke-width="1.2"/>
  </g>
  <text x="620" y="178" class="tiny white" font-size="11.5">CD <tspan class="red">·</tspan> DVD <tspan class="red">·</tspan> BLU-RAY</text>

  <!-- Subtle registration cuts at the waist -->
  <path d="M574 103 L582 108 M618 132 L626 137" stroke="#D6001C" stroke-width="2"/>
</svg>
