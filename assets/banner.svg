    C 400 98, 500 112, 600 116
    C 700 112, 800 98, 890 78
    C 1000 48, 1110 22, 1188 36
    L 1188 224
    C 1110 238, 1000 212, 890 182
    C 800 162, 700 148, 600 144
    C 500 148, 400 162, 310 182
    C 200 212, 90 238, 12 224
    Z"/>
  <path fill="#0a0a0a" d="
    M 38 54
    C 110 42, 220 64, 320 92
    C 410 110, 510 120, 600 124
    C 690 120, 790 110, 880 92
    C 980 64, 1090 42, 1162 54
    L 1162 206
    C 1090 218, 980 196, 880 168
    C 790 150, 690 140, 600 136
    C 510 140, 410 150, 320 168
    C 220 196, 110 218, 38 206
