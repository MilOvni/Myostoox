  <path d="M50 66 C180 78, 360 108, 520 120" fill="none" stroke="#f8efc4" stroke-width="1.15" opacity=".4" stroke-linecap="round"/>
  <path d="M50 194 C180 182, 360 152, 520 140" fill="none" stroke="#f8efc4" stroke-width="1.15" opacity=".4" stroke-linecap="round"/>
  <path d="M1150 66 C1020 78, 840 108, 680 120" fill="none" stroke="#f8efc4" stroke-width="1.15" opacity=".4" stroke-linecap="round"/>
  <path d="M1150 194 C1020 182, 840 152, 680 140" fill="none" stroke="#f8efc4" stroke-width="1.15" opacity=".4" stroke-linecap="round"/>

  <!-- AUDIO — baseline descends toward center -->
  <g class="t" text-anchor="middle">
    <text x="72"  y="126" font-size="34">A</text>
    <text x="100" y="128" font-size="30">U</text>
    <text x="126" y="130" font-size="26">D</text>
    <text x="149" y="132" font-size="22">I</text>
    <text x="168" y="134" font-size="18">O</text>
  </g>
  <circle class="dot" cx="188" cy="132" r="2.2"/>

  <!-- MUSIC -->
  <g class="t" text-anchor="middle">
    <text x="218" y="128" font-size="20">M</text>
    <text x="238" y="130" font-size="17">U</text>
    <text x="255" y="132" font-size="15">S</text>
    <text x="270" y="133" font-size="13">I</text>
    <text x="282" y="135" font-size="11">C</text>
