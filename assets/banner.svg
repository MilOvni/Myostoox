<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Myostoox</title>
  <desc id="desc">Gold brush ribbon on black — music, radio, IPTV, disc and video converging on a pixel spectrum.</desc>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a34a"/>
      <stop offset="45%" stop-color="#a67e1f"/>
      <stop offset="100%" stop-color="#7d5c14"/>
    </linearGradient>
    <linearGradient id="gold-soft" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a67e1f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a67e1f" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#a67e1f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e2c56a"/>
      <stop offset="55%" stop-color="#a67e1f"/>
      <stop offset="100%" stop-color="#5c440e"/>
    </radialGradient>
    <style>
      .t {
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
        font-weight: 700;
        fill: #f8efc4;
      }
      .dot { fill: #c9a34a; }
      .px { fill: #f8efc4; }
    </style>
  </defs>

  <rect width="1200" height="260" fill="#0a0a0a"/>
  <ellipse cx="600" cy="128" rx="200" ry="64" fill="url(#gold-soft)"/>

  <path fill="url(#gold)" d="
