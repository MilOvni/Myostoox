<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Myostoox — audio, music, radio · iptv, cd/dvd, video</title>
  <desc id="desc">Two thin gold bars flanking a central play medallion with a pixel spectrum.</desc>
  <defs>
    <linearGradient id="gold-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a34a"/>
      <stop offset="100%" stop-color="#a67e1f"/>
    </linearGradient>
    <linearGradient id="gold-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1f"/>
      <stop offset="100%" stop-color="#c9a34a"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e8cd72"/>
      <stop offset="55%" stop-color="#a67e1f"/>
      <stop offset="100%" stop-color="#5a420e"/>
    </radialGradient>
    <style>
      .bar-text {
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 700;
        fill: #f8efc4;
        letter-spacing: 0.12em;
      }
      .px { fill: #a67e1f; }
    </style>
  </defs>

  <!-- Bars thinner (h=26), letters unchanged -->
  <rect x="36" y="83" width="508" height="26" rx="3" fill="url(#gold-l)"/>
  <rect x="656" y="83" width="508" height="26" rx="3" fill="url(#gold-r)"/>
  <rect x="36" y="83" width="508" height="26" rx="3" fill="none" stroke="#f8efc4" stroke-width="0.7" opacity=".3"/>
  <rect x="656" y="83" width="508" height="26" rx="3" fill="none" stroke="#f8efc4" stroke-width="0.7" opacity=".3"/>

  <text class="bar-text" x="290" y="102" text-anchor="middle" font-size="18">AUDIO  ·  MUSIC  ·  RADIO</text>
  <text class="bar-text" x="910" y="102" text-anchor="middle" font-size="18">IPTV  ·  CD/DVD  ·  VIDEO</text>

  <!-- Medallion -->
  <circle cx="600" cy="96" r="38" fill="url(#core)"/>
  <circle cx="600" cy="96" r="38" fill="none" stroke="#f8efc4" stroke-width="2.2"/>
  <path fill="#f8efc4" d="M588 78 L620 96 L588 114 Z"/>

