    <rect class="px" x="-53" y="-10" width="4.5" height="4" rx="0.4" opacity=".85"/>
    <rect class="px" x="-47" y="-5" width="4.5" height="4" rx="0.4" opacity=".65"/>
    <rect class="px" x="-41" y="-5" width="4.5" height="4" rx="0.4" opacity=".7"/>
    <rect class="px" x="-41" y="-10" width="4.5" height="4" rx="0.4" opacity=".82"/>
    <rect class="px" x="-41" y="-15" width="4.5" height="4" rx="0.4" opacity=".95"/>
    <rect class="px" x="-35" y="-5" width="4.5" height="4" rx="0.4" opacity=".7"/>
    <rect class="px" x="-35" y="-10" width="4.5" height="4" rx="0.4" opacity=".88"/>
    <rect class="px" x="-29" y="-5" width="4.5" height="4" rx="0.4" opacity=".68"/>
    <rect class="px" x="-29" y="-10" width="4.5" height="4" rx="0.4" opacity=".78"/>
    <rect class="px" x="-29" y="-15" width="4.5" height="4" rx="0.4" opacity=".9"/>
    <rect class="px" x="-29" y="-20" width="4.5" height="4" rx="0.4" opacity="1"/>
    <rect class="px" x="-23" y="-5" width="4.5" height="4" rx="0.4" opacity=".7"/>
    <rect class="px" x="-23" y="-10" width="4.5" height="4" rx="0.4" opacity=".84"/>
    <rect class="px" x="-23" y="-15" width="4.5" height="4" rx="0.4" opacity=".95"/>
    <rect class="px" x="-17" y="-5" width="4.5" height="4" rx="0.4" opacity=".65"/>
    <rect class="px" x="-17" y="-10" width="4.5" height="4" rx="0.4" opacity=".75"/>
    <rect class="px" x="-17" y="-15" width="4.5" height="4" rx="0.4" opacity=".85"/>
    <rect class="px" x="-17" y="-20" width="4.5" height="4" rx="0.4" opacity=".95"/>
    <rect class="px" x="-17" y="-25" width="4.5" height="4" rx="0.4" opacity="1"/>
    <rect class="px" x="-11" y="-5" width="4.5" height="4" rx="0.4" opacity=".68"/>
    <rect class="px" x="-11" y="-10" width="4.5" height="4" rx="0.4" opacity=".78"/>
    <rect class="px" x="-11" y="-15" width="4.5" height="4" rx="0.4" opacity=".9"/>
    <rect class="px" x="-11" y="-20" width="4.5" height="4" rx="0.4" opacity="1"/>
    <rect class="px" x="-5" y="-5" width="4.5" height="4" rx="0.4" opacity=".7"/>
    <rect class="px" x="-5" y="-10" width="4.5" height="4" rx="0.4" opacity=".84"/>
    <rect class="px" x="-5" y="-15" width="4.5" height="4" rx="0.4" opacity=".95"/>
    <rect class="px" x="1" y="-5" width="4.5" height="4" rx="0.4" opacity=".65"/>
    <rect class="px" x="1" y="-10" width="4.5" height="4" rx="0.4" opacity=".75"/>
    <rect class="px" x="1" y="-15" width="4.5" height="4" rx="0.4" opacity=".85"/>
    <rect class="px" x="1" y="-20" width="4.5" height="4" rx="0.4" opacity=".95"/>
    <rect class="px" x="1" y="-25" width="4.5" height="4" rx="0.4" opacity="1"/>
    <rect class="px" x="7" y="-5" width="4.5" height="4" rx="0.4" opacity=".7"/>
    <rect class="px" x="7" y="-10" width="4.5" height="4" rx="0.4" opacity=".88"/>
    <rect class="px" x="13" y="-5" width="4.5" height="4" rx="0.4" opacity=".68"/>
    <rect class="px" x="13" y="-10" width="4.5" height="4" rx="0.4" opacity=".78"/>
    <rect class="px" x="13" y="-15" width="4.5" height="4" rx="0.4" opacity=".9"/>
    <rect class="px" x="13" y="-20" width="4.5" height="4" rx="0.4" opacity="1"/>
    <rect class="px" x="19" y="-5" width="4.5" height="4" rx="0.4" opacity=".7"/>
    <rect class="px" x="19" y="-10" width="4.5" height="4" rx="0.4" opacity=".84"/>
    <rect class="px" x="19" y="-15" width="4.5" height="4" rx="0.4" opacity=".95"/>
    <rect class="px" x="25" y="-5" width="4.5" height="4" rx="0.4" opacity=".7"/>
    <rect class="px" x="25" y="-10" width="4.5" height="4" rx="0.4" opacity=".88"/>
    <rect class="px" x="31" y="-5" width="4.5" height="4" rx="0.4" opacity=".65"/>
    <rect class="px" x="37" y="-5" width="4.5" height="4" rx="0.4" opacity=".7"/>
    <rect class="px" x="37" y="-10" width="4.5" height="4" rx="0.4" opacity=".82"/>
    <rect class="px" x="37" y="-15" width="4.5" height="4" rx="0.4" opacity=".95"/>
    <rect class="px" x="43" y="-5" width="4.5" height="4" rx="0.4" opacity=".7"/>
    <rect class="px" x="43" y="-10" width="4.5" height="4" rx="0.4" opacity=".85"/>
    <rect class="px" x="49" y="-5" width="4.5" height="4" rx="0.4" opacity=".65"/>
