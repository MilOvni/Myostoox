  <!-- IPTV — nearer center = lower -->
  <g class="t" text-anchor="middle">
    <text x="831" y="136" font-size="9">I</text>
    <text x="841" y="134" font-size="10">P</text>
    <text x="853" y="132" font-size="11">T</text>
    <text x="866" y="130" font-size="13">V</text>
  </g>
  <circle class="dot" cx="884" cy="133" r="1.8"/>

  <!-- CD/DVD -->
  <g class="t" text-anchor="middle">
    <text x="908" y="135" font-size="11">C</text>
    <text x="922" y="133" font-size="13">D</text>
