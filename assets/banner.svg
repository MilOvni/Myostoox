<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Myostoox — audio, music, radio · iptv, cd/dvd, video</title>
  <desc id="desc">Two thin gold bars flanking a central play medallion with a pixel spectrum, on black.</desc>
  <defs>
    <linearGradient id="gold-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a34a"/>
      <stop offset="100%" stop-color="#a67e1f"/>
    </linearGradient>
    <linearGradient id="gold-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1f"/>
      <stop offset="100%" stop-color="#c9a34a"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e8cd72"/>
      <stop offset="55%" stop-color="#a67e1f"/>
      <stop offset="100%" stop-color="#5a420e"/>
    </radialGradient>
    <style>
      .bar-text {
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 700;
        fill: #f8efc4;
        letter-spacing: 0.14em;
      }
      .px { fill: #f8efc4; }
    </style>
  </defs>

  <rect width="1200" height="220" fill="#0a0a0a"/>

  <!-- Left bar (thin, from outer edge to medallion) -->
  <rect x="48" y="88" width="500" height="28" rx="3" fill="url(#gold-l)"/>
  <!-- Right bar -->
  <rect x="652" y="88" width="500" height="28" rx="3" fill="url(#gold-r)"/>

  <!-- Hairline cream edges on the bars -->
  <rect x="48" y="88" width="500" height="28" rx="3" fill="none" stroke="#f8efc4" stroke-width="0.75" opacity=".25"/>
  <rect x="652" y="88" width="500" height="28" rx="3" fill="none" stroke="#f8efc4" stroke-width="0.75" opacity=".25"/>

  <!-- Left labels -->
  <text class="bar-text" x="298" y="108" text-anchor="middle" font-size="15">AUDIO  ·  MUSIC  ·  RADIO</text>

  <!-- Right labels -->
  <text class="bar-text" x="902" y="108" text-anchor="middle" font-size="15">IPTV  ·  CD/DVD  ·  VIDEO</text>

  <!-- Medallion (unchanged spirit) -->
  <circle cx="600" cy="102" r="36" fill="url(#core)"/>
  <circle cx="600" cy="102" r="36" fill="none" stroke="#f8efc4" stroke-width="2"/>
  <path fill="#f8efc4" d="M589 86 L618 102 L589 118 Z"/>

